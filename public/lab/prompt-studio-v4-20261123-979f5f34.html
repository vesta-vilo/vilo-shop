<html lang="zh">
<head>

<meta name="robots" content="noindex, nofollow">

<body>
<title>Vilo Prompt Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600&display=swap">
<style>
/* Layout: a fixed command bar, a contents rail on the left, one prompt group at a time on the right. */
:root {
  --bg: #f2f4f7;
  --surface: #ffffff;
  --sunken: #e9edf2;
  --ink: #1d1d1d;
  --muted: #5b6170;
  --line: #d9dee6;
  --accent: #2b55c7;
  --accent-soft: #e4ebfb;
  --changed: #a35a05;
  --changed-soft: #fff1d6;
  --ins: #0f6b3c;
  --ins-soft: #dff3e6;
  --del: #a3261f;
  --del-soft: #fbe3e1;
  --font-ui: "Inter", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
  --font-display: "Space Grotesk", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --bar-h: 56px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #13161b; --surface: #1b1f26; --sunken: #232831; --ink: #e8ebf0; --muted: #9aa3b2; --line: #2d333d;
    --accent: #86a6ff; --accent-soft: #1f2b4d; --changed: #f0b45a; --changed-soft: #3a2c12;
    --ins: #6fd49a; --ins-soft: #143424; --del: #ff9a92; --del-soft: #40201d; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #13161b; --surface: #1b1f26; --sunken: #232831; --ink: #e8ebf0; --muted: #9aa3b2; --line: #2d333d;
  --accent: #86a6ff; --accent-soft: #1f2b4d; --changed: #f0b45a; --changed-soft: #3a2c12;
  --ins: #6fd49a; --ins-soft: #143424; --del: #ff9a92; --del-soft: #40201d; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 14px; line-height: 1.55; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
a { color: var(--accent); text-underline-offset: 2px; }
code { font-family: var(--font-mono); font-size: 0.86em; background: var(--sunken); padding: 1px 5px; border-radius: 4px; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.bar-in { min-height: var(--bar-h); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding-block: 8px; }
.brand { font-family: var(--font-display); font-weight: 600; font-size: 17px; letter-spacing: -0.01em; margin-right: auto; white-space: nowrap; }
.brand small { font-family: var(--font-mono); font-weight: 400; font-size: 11px; color: var(--muted); margin-left: 8px; }
.search { flex: 1 1 180px; max-width: 320px; min-width: 0; height: 34px; padding: 0 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
.btn { height: 34px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); font-weight: 500; }
.btn.small { height: 28px; padding: 0 9px; font-size: 12.5px; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.count { font-variant-numeric: tabular-nums; }
#navToggle { display: none; }

.shell { display: grid; grid-template-columns: 272px minmax(0, 1fr); align-items: start; }
nav {
  position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--bar-h) + 1px); max-height: calc(100vh - var(--bar-h) - 1px); overflow-y: auto;
  padding: 14px 8px 40px max(12px, env(safe-area-inset-left, 0px)); border-right: 1px solid var(--line);
}
nav h2 { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; color: var(--muted); margin: 16px 8px 4px; text-transform: uppercase; }
nav a { display: flex; align-items: baseline; gap: 6px; padding: 5px 8px; border-radius: 6px; color: var(--ink); text-decoration: none; font-size: 13px; }
nav a:hover { background: var(--sunken); }
nav a.on { background: var(--accent-soft); color: var(--accent); font-weight: 500; }
nav a .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
nav a .n { font-size: 11px; color: var(--changed); font-weight: 600; font-variant-numeric: tabular-nums; }
nav a .hit { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
nav .empty { color: var(--muted); padding: 8px; font-size: 13px; }

main { min-width: 0; padding: 24px max(16px, env(safe-area-inset-right, 0px)) 80px 28px; max-width: 980px; }
h1 { font-family: var(--font-display); font-size: 26px; font-weight: 600; letter-spacing: -0.015em; line-height: 1.2; margin: 0; text-wrap: balance; overflow-wrap: anywhere; }
.eyebrow { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.sub { color: var(--muted); margin: 6px 0 0; max-width: 70ch; }
.desc { margin: 14px 0 0; max-width: 74ch; }
.params { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
.param { font-family: var(--font-mono); font-size: 11.5px; border: 1px solid var(--line); border-radius: 6px; padding: 2px 7px; color: var(--muted); max-width: 100%; overflow-wrap: anywhere; }
.param b { color: var(--ink); font-weight: 500; }
.items { display: flex; flex-direction: column; gap: 16px; margin-top: 24px; }

.block { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.block.changed { border-color: var(--changed); }
.bh { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.bh h3 { margin: 0; font-size: 14px; font-weight: 600; overflow-wrap: anywhere; }
.pill { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 99px; background: var(--changed-soft); color: var(--changed); }
.src { margin-left: auto; font-family: var(--font-mono); font-size: 11px; color: var(--muted); overflow-wrap: anywhere; }
textarea.text {
  width: 100%; min-height: 44px; resize: vertical; border: 1px solid var(--line); border-radius: 8px; background: var(--bg);
  padding: 10px 12px; font-size: 14px; line-height: 1.6; overflow: hidden;
}
textarea.text:focus { background: var(--surface); }
.vars { display: flex; flex-wrap: wrap; gap: 6px; }
.var { font-family: var(--font-mono); font-size: 11.5px; background: var(--accent-soft); color: var(--accent); border-radius: 5px; padding: 1px 6px; max-width: 100%; overflow-wrap: anywhere; }
.var i { font-style: normal; color: var(--muted); }
.warn { color: var(--del); background: var(--del-soft); border-radius: 6px; padding: 6px 10px; font-size: 12.5px; }
.bf { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.bf .meta { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; margin-right: auto; }
.note { flex: 1 1 220px; min-width: 0; height: 28px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); padding: 0 8px; font-size: 12.5px; }
.preview { white-space: pre-wrap; overflow-wrap: anywhere; background: var(--sunken); border-radius: 8px; padding: 10px 12px; font-size: 13.5px; }
.preview mark { background: var(--accent-soft); color: var(--accent); border-radius: 3px; padding: 0 2px; }
.ref { border: 1px dashed var(--line); border-radius: 10px; padding: 12px 16px; color: var(--muted); }
.ref .bh h3 { color: var(--ink); font-family: var(--font-mono); font-weight: 500; font-size: 13px; }
.ref p { margin: 8px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13px; max-height: 7.8em; overflow: auto; }

.flow { list-style: none; counter-reset: step; margin: 14px 0 0; padding: 0; display: flex; flex-direction: column; gap: 0; max-width: 78ch; }
.flow li { counter-increment: step; position: relative; padding: 0 0 16px 40px; }
.flow li::before { content: counter(step); position: absolute; left: 0; top: 0; width: 26px; height: 26px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-weight: 600; font-size: 12.5px; display: grid; place-items: center; font-variant-numeric: tabular-nums; }
.flow li::after { content: ""; position: absolute; left: 12.5px; top: 30px; bottom: 2px; width: 1px; background: var(--line); }
.flow li:last-child::after { display: none; }
.flow b { font-weight: 600; }
.flow .out { color: var(--muted); display: block; font-size: 13px; }
.stack { font-family: var(--font-mono); font-size: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-top: 8px; display: flex; flex-direction: column; gap: 3px; overflow-x: auto; }
.stack span { white-space: nowrap; }
.stack em { font-style: normal; color: var(--muted); }
h2.sec { font-family: var(--font-display); font-size: 18px; font-weight: 600; margin: 36px 0 0; }
.howto { margin: 12px 0 0; padding-left: 20px; max-width: 74ch; }
.howto li { margin-bottom: 4px; }
.stats { display: flex; gap: 24px; flex-wrap: wrap; margin-top: 16px; color: var(--muted); font-size: 13px; }
.stats b { color: var(--ink); font-variant-numeric: tabular-nums; }

.surface { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 28px; align-items: start; margin-top: 24px; }
.phone { border: 1px solid var(--line); border-radius: 30px; background: var(--surface); padding: 22px 12px 26px; display: flex; flex-direction: column; gap: 8px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--bar-h) + 16px); }
.phone::before { content: ""; width: 64px; height: 5px; border-radius: 3px; background: var(--line); align-self: center; margin-bottom: 8px; }
.el { display: flex; gap: 8px; align-items: flex-start; text-align: left; width: 100%; border-radius: 10px; padding: 8px 10px; font-size: 12.5px; line-height: 1.4; }
.el.fixed { border: 1px dashed var(--line); color: var(--muted); background: transparent; }
.el.ai { border: 1px solid var(--accent); background: var(--accent-soft); color: var(--ink); }
.el.ai:hover { background: var(--surface); }
.el .num { flex: none; width: 20px; height: 20px; border-radius: 50%; background: var(--accent); color: var(--surface); font-size: 11.5px; font-weight: 600; display: grid; place-items: center; font-variant-numeric: tabular-nums; }
.el .body { min-width: 0; display: flex; flex-direction: column; gap: 4px; flex: 1; }
.el .sk { display: flex; flex-direction: column; gap: 4px; }
.el .sk i { display: block; height: 6px; border-radius: 3px; background: var(--accent); opacity: 0.28; }
.el.title b { font-size: 14px; font-weight: 600; }
.el .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
.el .cards i { height: 26px; border-radius: 6px; background: var(--accent); opacity: 0.22; }
.el em { font-style: normal; color: var(--muted); }
.legend { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 14px; font-size: 12.5px; color: var(--muted); }
.legend span::before { content: ""; display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-right: 6px; border: 1px dashed var(--line); }
.legend span.a::before { border: 1px solid var(--accent); background: var(--accent-soft); }
.spots { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.spot { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; scroll-margin-top: calc(var(--bar-h) + 24px); }
.spot.flash { border-color: var(--accent); }
.spot h3 { margin: 0; font-size: 14px; font-weight: 600; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.spot h3 .num { flex: none; width: 20px; height: 20px; border-radius: 50%; background: var(--accent); color: var(--surface); font-size: 11.5px; display: inline-grid; place-items: center; align-self: center; }
.spot h3 small { font-family: var(--font-mono); font-weight: 400; font-size: 11px; color: var(--muted); }
.spot dl { margin: 0; display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 3px 12px; font-size: 13px; }
.spot dt { color: var(--muted); }
.spot dd { margin: 0; overflow-wrap: anywhere; }
.spot .sample { font-style: italic; }
.shows { margin: 12px 0 0; padding: 8px 12px; border-radius: 8px; background: var(--accent-soft); max-width: 74ch; font-size: 13px; }
.change h3 a { color: inherit; }
.diff { white-space: pre-wrap; overflow-wrap: anywhere; background: var(--bg); border-radius: 8px; padding: 10px 12px; font-size: 13.5px; }
.diff ins { background: var(--ins-soft); color: var(--ins); text-decoration: none; border-radius: 3px; }
.diff del { background: var(--del-soft); color: var(--del); border-radius: 3px; }
.emptyState { color: var(--muted); margin-top: 24px; }

.scrim { position: fixed; inset: 0; z-index: 20; background: rgba(10, 14, 22, 0.55); display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.modal { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; width: min(680px, 100%); max-height: 100%; overflow: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
.modal h2 { font-family: var(--font-display); font-size: 19px; margin: 0; }
.modal p { margin: 0; color: var(--muted); }
.modal textarea { width: 100%; height: 220px; font-family: var(--font-mono); font-size: 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); padding: 10px; resize: vertical; }
.modal .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.modal .row .grow { flex: 1 1 160px; min-width: 0; height: 34px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); padding: 0 10px; }
.gate { min-height: 70vh; display: grid; place-items: center; padding: 24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); }
.gate .modal { width: min(380px, 100%); }
.status { font-size: 13px; color: var(--ins); min-height: 1.4em; }
.status.bad { color: var(--del); }

@media (max-width: 1080px) {
  .surface { grid-template-columns: minmax(0, 1fr); }
  .phone { position: static; max-width: 340px; }
}
@media (max-width: 820px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  #navToggle { display: inline-block; }
  nav { position: static; max-height: none; border-right: 0; border-bottom: 1px solid var(--line); padding: 8px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px)); }
  nav:not(.open) { display: none; }
  main { padding: 20px max(16px, env(safe-area-inset-right, 0px)) 64px max(16px, env(safe-area-inset-left, 0px)); }
  .src { margin-left: 0; flex-basis: 100%; }
  .surface { grid-template-columns: minmax(0, 1fr); }
  .phone { position: static; max-width: 340px; }
  h1 { font-size: 22px; }
}
@media (prefers-reduced-motion: no-preference) { nav a, .btn { transition: background-color 0.12s, border-color 0.12s; } }
</style>

<div id="gate" class="gate" hidden>
  <form class="modal" id="gateForm" autocomplete="off">
    <h2>Vilo Prompt Studio</h2>
    <p>内部页面，请输入密码。</p>
    <div class="row"><input class="grow" id="gatePass" type="password" placeholder="密码" aria-label="密码"><button class="btn primary" id="gateBtn" type="submit">进入</button></div>
    <div class="status bad" id="gateStatus" role="status"></div>
  </form>
</div>
<div id="app" hidden>
<header class="bar">
  <div class="bar-in">
    <div class="brand">Vilo Prompt Studio<small id="commit"></small></div>
    <button class="btn" id="navToggle" type="button">目录</button>
    <input class="search" id="search" type="search" placeholder="搜索 prompt 文字或名称" aria-label="搜索">
    <a class="btn" id="changesLink" href="#changes" style="display:inline-flex;align-items:center;text-decoration:none;color:inherit">已修改&nbsp;<span class="count" id="changedCount">0</span></a>
    <button class="btn" id="importBtn" type="button">导入</button>
    <button class="btn primary" id="exportBtn" type="button">导出修改</button>
  </div>
</header>
<div class="shell">
  <nav id="nav" aria-label="目录"></nav>
  <main id="main"></main>
</div>
<div id="modalRoot"></div>

<script>
function startPromptStudio(DATA) {
  "use strict";
  var DRAFT_KEY = "vilo-prompt-studio:draft";
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); };

  // id → block, with its group
  var BLOCKS = {};
  var blockOrder = [];
  DATA.sections.forEach(function (section) {
    section.groups.forEach(function (gid) {
      var group = DATA.groups[gid];
      group.items.forEach(function (item) {
        if (item.type === "block") { item.group = gid; BLOCKS[item.id] = item; blockOrder.push(item.id); }
      });
    });
  });

  // ── edits ────────────────────────────────────────────────────────────────
  var edits = {}; // id → { text, note, stale }
  try {
    var saved = JSON.parse(localStorage.getItem(DRAFT_KEY) || "{}");
    Object.keys(saved).forEach(function (id) { if (BLOCKS[id]) edits[id] = saved[id]; });
  } catch (e) { /* no stored draft */ }
  function persist() { try { localStorage.setItem(DRAFT_KEY, JSON.stringify(edits)); } catch (e) { /* private window */ } }
  function textOf(id) { return edits[id] && typeof edits[id].text === "string" ? edits[id].text : BLOCKS[id].text; }
  function isChanged(id) { return !!edits[id] && (textOf(id) !== BLOCKS[id].text || !!edits[id].note); }
  function setEdit(id, patch) {
    var next = Object.assign({ text: BLOCKS[id].text, note: "" }, edits[id] || {}, patch);
    if (next.text === BLOCKS[id].text && !next.note) { delete edits[id]; } else { edits[id] = next; }
    persist();
    refreshCounts();
  }
  function changedIds() { return blockOrder.filter(isChanged); }

  // ── variables ────────────────────────────────────────────────────────────
  function parts(text) {
    var out = [], buf = "", i = 0;
    while (i < text.length) {
      if (text[i] === "$" && text[i + 1] === "{") {
        var depth = 1, j = i + 2;
        while (j < text.length && depth > 0) { depth += text[j] === "{" ? 1 : text[j] === "}" ? -1 : 0; j++; }
        if (depth === 0) { if (buf) out.push({ lit: buf }); buf = ""; out.push({ expr: text.slice(i + 2, j - 1) }); i = j; continue; }
      }
      buf += text[i++];
    }
    if (buf) out.push({ lit: buf });
    return out;
  }
  function unknownVars(block, text) {
    if (block.kind !== "template") return [];
    return parts(text).filter(function (p) { return p.expr !== undefined && !(p.expr in block.vals); }).map(function (p) { return p.expr; });
  }
  function previewHtml(block, text) {
    if (block.kind !== "template") return esc(text);
    return parts(text).map(function (p) {
      if (p.expr === undefined) return esc(p.lit);
      var value = block.vals[p.expr];
      return "<mark title=\"" + esc(p.expr) + "\">" + esc(value == null ? "‹" + p.expr + "›" : value) + "</mark>";
    }).join("");
  }
  function countWords(text) { var m = text.replace(/\$\{[^}]*\}/g, "x").match(/\S+/g); return m ? m.length : 0; }

  // ── nav ──────────────────────────────────────────────────────────────────
  var query = "";
  function groupMatches(group) {
    if (!query) return -1;
    var q = query.toLowerCase(), hits = 0;
    if ((group.title + " " + group.sub).toLowerCase().indexOf(q) >= 0) hits++;
    group.items.forEach(function (item) {
      if (item.type === "block" && (textOf(item.id) + " " + item.label).toLowerCase().indexOf(q) >= 0) hits++;
    });
    return hits;
  }
  function renderNav() {
    var html = "<a href=\"#overview\" class=\"" + (current === "overview" ? "on" : "") + "\"><span class=\"t\">总览 · prompt 是怎么拼起来的</span></a>";
    html += "<h2>按界面看</h2>" + DATA.surfaces.map(function (surface) {
      var count = surface.elements.filter(function (el) { return el.kind === "ai"; }).length;
      return "<a href=\"#s-" + surface.id + "\" class=\"" + (current === "s-" + surface.id ? "on" : "") + "\"><span class=\"t\">" + esc(surface.title) + "</span><span class=\"hit\">" + count + "</span></a>";
    }).join("");
    var any = false;
    DATA.sections.forEach(function (section) {
      var rows = "";
      section.groups.forEach(function (gid) {
        var group = DATA.groups[gid], hits = groupMatches(group);
        if (hits === 0) return;
        var changed = group.items.filter(function (item) { return item.type === "block" && isChanged(item.id); }).length;
        rows += "<a href=\"#g-" + gid + "\" class=\"" + (current === "g-" + gid ? "on" : "") + "\" title=\"" + esc(group.sub || group.title) + "\"><span class=\"t\">" + esc(group.title) + "</span>" +
          (hits > 0 ? "<span class=\"hit\">" + hits + "</span>" : "") + (changed ? "<span class=\"n\">" + changed + "</span>" : "") + "</a>";
      });
      if (rows) { any = true; html += "<h2>" + esc(section.title) + "</h2>" + rows; }
    });
    if (!any) html += "<div class=\"empty\">没有匹配“" + esc(query) + "”的内容。</div>";
    $("nav").innerHTML = html;
  }
  function refreshCounts() {
    $("changedCount").textContent = changedIds().length;
    renderNav();
  }

  // ── group view ───────────────────────────────────────────────────────────
  function autosize(el) { el.style.height = "auto"; el.style.height = el.scrollHeight + 2 + "px"; }
  function blockHtml(block, index) {
    var vars = Object.keys(block.vals).map(function (expr) {

  // ── changes view ─────────────────────────────────────────────────────────
  function diffHtml(a, b) {
    var x = a.split(/(\s+)/), y = b.split(/(\s+)/);
    if (x.length * y.length > 6e6) return "<del>" + esc(a) + "</del>\n\n<ins>" + esc(b) + "</ins>";
    var n = x.length, m = y.length, w = m + 1, table = new Uint32Array((n + 1) * w), i, j;
    for (i = n - 1; i >= 0; i--) for (j = m - 1; j >= 0; j--) table[i * w + j] = x[i] === y[j] ? table[(i + 1) * w + j + 1] + 1 : Math.max(table[(i + 1) * w + j], table[i * w + j + 1]);
    var out = ""; i = 0; j = 0;
    while (i < n && j < m) {
      if (x[i] === y[j]) { out += esc(x[i]); i++; j++; }
      else if (table[(i + 1) * w + j] >= table[i * w + j + 1]) { out += "<del>" + esc(x[i++]) + "</del>"; }
      else { out += "<ins>" + esc(y[j++]) + "</ins>"; }
    }
    while (i < n) out += "<del>" + esc(x[i++]) + "</del>";
    while (j < m) out += "<ins>" + esc(y[j++]) + "</ins>";
    return out;
  }

  // ── routing ──────────────────────────────────────────────────────────────
  // The view shown. Follows the hash where the host keeps one; a click on an in-page link works without it too.
  var current = location.hash.replace(/^#/, "") || "overview";
  function go(name) {
    current = name || "overview";
    try { if (location.hash.replace(/^#/, "") !== current) location.hash = current; } catch (e) { /* no hash here */ }
    route();
  }
  function route() {
    var name = current;
    var gid = name.indexOf("g-") === 0 ? name.slice(2) : "";
    var sid = name.indexOf("s-") === 0 ? name.slice(2) : "";
    if (sid && DATA.surfaces.some(function (entry) { return entry.id === sid; })) renderSurface(sid);
    else if (gid && DATA.groups[gid]) renderGroup(gid);
    else if (name === "changes") renderChanges();
    else renderOverview();
    renderNav();
    $("nav").classList.remove("open");
    window.scrollTo(0, 0);
  }

    var fill = function () { $("exportText").value = exportJson($("author").value.trim()); };
    fill();
    $("author").addEventListener("input", function () { try { localStorage.setItem(DRAFT_KEY + ":author", $("author").value); } catch (e) { /* none */ } fill(); });
    $("closeBtn").addEventListener("click", closeModal);
    $("copyBtn").addEventListener("click", function () {
      var done = function () { $("exportStatus").className = "status"; $("exportStatus").textContent = "已复制"; };
      var fallback = function () { $("exportText").focus(); $("exportText").select(); $("exportStatus").className = "status bad"; $("exportStatus").textContent = "已选中全部内容，请按 Ctrl/⌘ + C"; };
      try { navigator.clipboard.writeText($("exportText").value).then(done, fallback); } catch (e) { fallback(); }
    });
    // In a shared link the viewer saves files through the `downloads` capability; opened from disk, the browser does.
    $("downloadBtn").hidden = inViewer && !saver;
    $("downloadBtn").addEventListener("click", function () {
      var status = $("exportStatus"), stamp = new Date().toISOString().slice(0, 16).replace(/[-:T]/g, "");
      var filename = "vilo-prompts-" + stamp + ".json", content = $("exportText").value;
      var say = function (text, bad) { status.className = bad ? "status bad" : "status"; status.textContent = text; };
      if (saver) {
        saver.save({ filename: filename, data: content }).then(
          function () { say("已保存"); },
          function (error) { say(error && error.code === "declined" ? "已取消" : "这里不能保存文件，请用“复制”", !(error && error.code === "declined")); }
        );
        return;
      }
      try {
        var link = document.createElement("a");
        link.href = URL.createObjectURL(new Blob([content], { type: "application/json" }));
        link.download = filename;
        document.body.appendChild(link); link.click(); link.remove();
        say("已开始下载");
      } catch (e) { say("这里不能下载，请用“复制”", true); }
    });
  });

  function loadExport(raw) {
    var parsed = JSON.parse(raw);
    if (parsed.format !== DATA.format || !Array.isArray(parsed.changes)) throw new Error("不是 Prompt Studio 导出的内容");
    var loaded = 0, stale = 0, missing = 0;
    parsed.changes.forEach(function (change) {
      var block = BLOCKS[change.id];
      if (!block || typeof change.text !== "string") { missing++; return; }
      var isStale = change.original !== block.text;
      if (isStale) stale++;
      edits[change.id] = { text: change.text, note: change.note || "", stale: isStale };
      if (change.text === block.text && !change.note) delete edits[change.id];
      loaded++;
    });
    persist(); refreshCounts(); route();
    return "载入 " + loaded + " 段" + (stale ? "，其中 " + stale + " 段基于旧版本的原文，请核对" : "") + (missing ? "，" + missing + " 段在当前版本里已不存在" : "") + "。";
  }
  $("importBtn").addEventListener("click", function () {
    openModal("<h2>导入，继续编辑</h2><p>贴入之前导出的内容，或选择导出的 JSON 文件。载入后会覆盖同一段上现有的草稿。</p>" +
      "<textarea id=\"importText\" placeholder=\"在这里粘贴导出的 JSON\" aria-label=\"导入内容\"></textarea>" +
      "<div class=\"row\"><input id=\"importFile\" type=\"file\" accept=\".json,application/json\" aria-label=\"选择文件\"></div>" +
      "<div class=\"row\"><button class=\"btn primary\" id=\"loadBtn\" type=\"button\">载入</button><button class=\"btn\" id=\"clearBtn\" type=\"button\">清空全部草稿</button><span class=\"status\" id=\"importStatus\"></span><button class=\"btn ghost\" id=\"closeBtn\" type=\"button\" style=\"margin-left:auto\">关闭</button></div>");
    $("closeBtn").addEventListener("click", closeModal);
    $("importFile").addEventListener("change", function (event) {
      var file = event.target.files[0]; if (!file) return;
      var reader = new FileReader(); reader.onload = function () { $("importText").value = reader.result; }; reader.readAsText(file);
    });
    $("loadBtn").addEventListener("click", function () {
      var status = $("importStatus");
      try { status.className = "status"; status.textContent = loadExport($("importText").value); }
      catch (e) { status.className = "status bad"; status.textContent = "读不出来：" + e.message; }
    });
    var armed = false;
    $("clearBtn").addEventListener("click", function () {
      if (!armed) { armed = true; $("clearBtn").textContent = "再点一次确认清空"; return; }
      edits = {}; persist(); refreshCounts(); route();
      $("importStatus").className = "status"; $("importStatus").textContent = "草稿已清空"; $("clearBtn").textContent = "清空全部草稿"; armed = false;
    });
  });

  $("commit").textContent = [DATA.version, DATA.commit].filter(Boolean).join(" · ");
  refreshCounts();
  route();
}

// Boot. A copy on the public site carries its data encrypted (AES-GCM, key from the password):
// the page asks for the password and decrypts in the browser — nothing readable is in the file.
(function () {
  "use strict";
  var raw = JSON.parse(document.getElementById("ps-data").textContent);
  var gate = document.getElementById("gate"), app = document.getElementById("app");
  var PASS_KEY = "vilo-prompt-studio:pass";
  function open(data) { gate.hidden = true; app.hidden = false; startPromptStudio(data); }
  if (!raw.enc) { open(raw); return; }
  var bytes = function (b64) { var bin = atob(b64), out = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i); return out; };
  function decrypt(password) {
    var enc = raw.enc;
    return crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]).then(function (base) {
      return crypto.subtle.deriveKey({ name: "PBKDF2", salt: bytes(enc.salt), iterations: enc.iterations, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    }).then(function (key) {
      return crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(enc.iv) }, key, bytes(enc.data));
    }).then(function (plain) { return JSON.parse(new TextDecoder().decode(plain)); });
  }
  var input = document.getElementById("gatePass"), status = document.getElementById("gateStatus"), button = document.getElementById("gateBtn");
  function attempt(password, quiet) {
    if (!window.crypto || !crypto.subtle) { status.textContent = "这个浏览器打不开加密页面，请用 https 链接和新版浏览器。"; return; }
    button.disabled = true; status.textContent = quiet ? "" : "正在解锁…";
    decrypt(password).then(function (data) {
      try { localStorage.setItem(PASS_KEY, password); } catch (e) { /* not remembered */ }
      open(data);
    }, function () {
      button.disabled = false;
      try { localStorage.removeItem(PASS_KEY); } catch (e) { /* nothing stored */ }
      status.textContent = quiet ? "" : "密码不对，请再试一次。";
      if (!quiet) { input.select(); }
    });
  }
  gate.hidden = false;
  document.getElementById("gateForm").addEventListener("submit", function (event) { event.preventDefault(); if (input.value) attempt(input.value, false); });
  var remembered = "";
  try { remembered = localStorage.getItem(PASS_KEY) || ""; } catch (e) { /* none */ }
  if (remembered) attempt(remembered, true); else input.focus();
})();
</script>
