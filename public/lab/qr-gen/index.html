<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>QR Gen · Vilo Lab</title>
<style>
  :root {
    --bg: #f1f5f8; --panel: #ffffff; --ink: #14203a; --muted: #5a6577; --line: #d3dae2;
    --accent: #293d62; --accent-ink: #ffffff; --soft: #e4e9ed; --warn: #8a5300; --warn-bg: #fff3d9; --bad: #9c2a22;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  main { max-width: 980px; margin: 0 auto; padding: 32px 20px 64px; }
  header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 24px; }
  h1 { font-size: 24px; font-weight: 650; letter-spacing: -0.01em; margin: 0; }
  header span { color: var(--muted); font-size: 13px; }
  .grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 420px); gap: 24px; align-items: start; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  label { display: block; font-size: 12.5px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
  textarea, select, input[type="number"] { width: 100%; font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 9px; padding: 9px 11px; }
  textarea { min-height: 112px; resize: vertical; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 14px; }
  textarea:focus, select:focus, input:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .hint { background: var(--warn-bg); color: var(--warn); border-radius: 9px; padding: 10px 12px; font-size: 13.5px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .hint button { margin-left: auto; }
  .error { color: var(--bad); font-size: 13.5px; }
  button { font: inherit; cursor: pointer; border-radius: 9px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 9px 14px; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  button:disabled { opacity: 0.45; cursor: default; }
  .preview { background: var(--soft); border-radius: 10px; padding: 16px; display: grid; place-items: center; }
  .preview svg { width: 100%; max-width: 340px; height: auto; display: block; image-rendering: pixelated; }
  dl { margin: 0; display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 16px; font-size: 13.5px; font-variant-numeric: tabular-nums; }
  dt { color: var(--muted); }
  dd { margin: 0; }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .note { color: var(--muted); font-size: 12.5px; margin: 0; }
  @media (max-width: 760px) { .grid { grid-template-columns: minmax(0, 1fr); } .row { grid-template-columns: 1fr 1fr; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>QR Gen</h1>
    <span>The sparsest QR code that still holds your text.</span>
  </header>
  <div class="grid">
    <section class="panel">
      <div>
        <label for="text">Text or URL</label>
        <textarea id="text" spellcheck="false" autocomplete="off">https://vilo.co</textarea>
      </div>
      <div class="hint" id="upperHint" hidden>
        <span id="upperText"></span>
        <button type="button" id="upperBtn">Use uppercase</button>
      </div>
      <div class="row">
        <div>
          <label for="ecc">Error correction</label>
          <select id="ecc">
            <option value="L" selected>L · 7% (sparsest)</option>
            <option value="M">M · 15%</option>
            <option value="Q">Q · 25%</option>
            <option value="H">H · 30%</option>
          </select>
        </div>
        <div>
          <label for="quiet">Quiet zone (modules)</label>
          <select id="quiet">
            <option value="4" selected>4 (standard)</option>
            <option value="2">2</option>
            <option value="1">1</option>
            <option value="0">0</option>
          </select>
        </div>
        <div>
          <label for="scale">Module size (px)</label>
          <input id="scale" type="number" min="1" max="64" step="1" value="10">
        </div>
      </div>
      <p class="note">Density is kept as low as the text allows: the smallest version that fits, the most compact encoding (digits only, then uppercase letters and <code>$%*+-./:</code> with spaces, then anything else), and the lowest error correction unless you raise it.</p>
    </section>

    <section class="panel">
      <div class="preview" id="preview" aria-live="polite"></div>
      <div class="error" id="error" hidden></div>
      <dl id="stats"></dl>
      <div class="actions">
        <button type="button" id="svgBtn">Download SVG</button>
        <button type="button" class="primary" id="pngBtn">Download PNG @2x</button>
      </div>
      <p class="note" id="sizes"></p>
    </section>
  </div>
</main>

<script src="qr-core.js"></script>
<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var current = null; // { qr, quiet, scale, text }

  var MODE_NAMES = { numeric: "Numeric (digits)", alphanumeric: "Alphanumeric (uppercase)", byte: "Byte (UTF-8)" };

  function clampInt(value, min, max, fallback) {
    var n = parseInt(value, 10);
    return isNaN(n) ? fallback : Math.min(max, Math.max(min, n));
  }

  // One path: each row's dark runs as a rectangle, in module units.
  function svgMarkup(qr, quiet, px) {
    var total = qr.size + quiet * 2, d = "";
    for (var y = 0; y < qr.size; y++) {
      for (var x = 0; x < qr.size; x++) {
        if (!qr.modules[y][x]) continue;
        var start = x;
        while (x + 1 < qr.size && qr.modules[y][x + 1]) x++;
        d += "M" + (start + quiet) + " " + (y + quiet) + "h" + (x - start + 1) + "v1h-" + (x - start + 1) + "z";
      }
    }
    return '<svg xmlns="http://www.w3.org/2000/svg" width="' + total * px + '" height="' + total * px + '" viewBox="0 0 ' + total + " " + total +
      '" shape-rendering="crispEdges"><rect width="' + total + '" height="' + total + '" fill="#ffffff"/><path fill="#000000" d="' + d + '"/></svg>';
  }

  // Drawn module by module at whole pixels, so every edge is sharp.
  function pngCanvas(qr, quiet, px) {
    var total = qr.size + quiet * 2, canvas = document.createElement("canvas");
    canvas.width = canvas.height = total * px;
    var ctx = canvas.getContext("2d");
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#000000";
    for (var y = 0; y < qr.size; y++) for (var x = 0; x < qr.size; x++) {
      if (qr.modules[y][x]) ctx.fillRect((x + quiet) * px, (y + quiet) * px, px, px);
    }
    return canvas;
  }

  function fileName(text, suffix) {
    var slug = text.replace(/^[a-z]+:\/\//i, "").replace(/[^a-z0-9]+/gi, "-").replace(/^-+|-+$/g, "").slice(0, 40).toLowerCase();
    return "qr-" + (slug || "code") + suffix;
  }
  function save(blob, name) {
    var link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = name;
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(function () { URL.revokeObjectURL(link.href); }, 1000);
  }

  function render() {
    var text = $("text").value, ecc = $("ecc").value;
    var quiet = clampInt($("quiet").value, 0, 4, 4), scale = clampInt($("scale").value, 1, 64, 10);
    var error = $("error"), qr = null;
    try { qr = QR.encode(text, { ecc: ecc }); error.hidden = true; }
    catch (e) { error.textContent = text ? e.message + "." : "Type something to encode."; error.hidden = false; }
    current = qr ? { qr: qr, quiet: quiet, scale: scale, text: text } : null;
    $("svgBtn").disabled = $("pngBtn").disabled = !qr;

    // Uppercase letters fit the compact alphanumeric mode; say so when it would shrink the code.
    var hint = $("upperHint");
    hint.hidden = true;
    if (qr && qr.mode === "byte" && text !== text.toUpperCase()) {
      try {
        var upper = QR.encode(text.toUpperCase(), { ecc: ecc });
        if (upper.mode === "alphanumeric" && upper.size < qr.size) {
          $("upperText").textContent = "In uppercase this fits " + upper.size + "×" + upper.size + " instead of " + qr.size + "×" + qr.size +
            ". Domains ignore case; paths and codes may not.";
          hint.hidden = false;
        }
      } catch (e) { /* the uppercase form doesn't fit either */ }
    }

    if (!qr) { $("preview").innerHTML = ""; $("stats").innerHTML = ""; $("sizes").textContent = ""; return; }
    var total = qr.size + quiet * 2;
    $("preview").innerHTML = svgMarkup(qr, quiet, scale);
    $("stats").innerHTML =
      "<dt>Size</dt><dd>" + qr.size + " × " + qr.size + " modules (version " + qr.version + ")</dd>" +
      "<dt>Encoding</dt><dd>" + MODE_NAMES[qr.mode] + "</dd>" +
      "<dt>Error correction</dt><dd>" + qr.ecc + "</dd>" +
      "<dt>Capacity used</dt><dd>" + qr.usedBits + " of " + qr.capacityBits + " bits</dd>" +
      "<dt>Mask</dt><dd>" + qr.mask + "</dd>";
    $("sizes").textContent = "SVG " + total * scale + " × " + total * scale + " px (vector) · PNG " + total * scale * 2 + " × " + total * scale * 2 + " px (2x, " + scale * 2 + " px per module)";
  }

  $("svgBtn").addEventListener("click", function () {
    if (!current) return;
    save(new Blob([svgMarkup(current.qr, current.quiet, current.scale)], { type: "image/svg+xml" }), fileName(current.text, ".svg"));
  });
  $("pngBtn").addEventListener("click", function () {
    if (!current) return;
    var text = current.text;
    pngCanvas(current.qr, current.quiet, current.scale * 2).toBlob(function (blob) { save(blob, fileName(text, "@2x.png")); }, "image/png");
  });
  $("upperBtn").addEventListener("click", function () { $("text").value = $("text").value.toUpperCase(); render(); });
  ["text", "ecc", "quiet", "scale"].forEach(function (id) { $(id).addEventListener("input", render); });
  render();
})();
</script>
</body>
</html>
