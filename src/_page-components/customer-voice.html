<customer-voice class="customer-voice-section">
  <div class="container customer-voice-section__container">
    <div class="customer-voice-swiper-viewport">
      <div class="swiper customer-voice-swiper">
        <div class="swiper-wrapper js-customer-voice-slides"></div>
      </div>

      <div class="swiper-nav-holder">
        <div class="swiper-nav-btns">
          <div class="swiper-button-prev">
            <load src="/_icons/icon-prev-slide-arrow.html" />
          </div>
          <div class="swiper-button-next">
            <load src="/_icons/icon-next-slide-arrow.html" />
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="application/json" class="js-customer-voice-data">
    {
      "cta": {
        "title": "Learn more",
        "link": "/product/"
      },
      "slides": [
        {
          "title": "<span class=\"secondary-text\">Sleep,</span> read in full",
          "subtitle": "",
          "description": " Better nights make better days. Vilo reads your stages, blood-oxygen trends, and the shape of each night, then tells you what actually mattered. Not more numbers. A little more understanding.",
          "image": "/images/sections/customer-voice/1.webp",
          "alt": "Customer voice story 1",
          "badge-icon": "/images/icons/icon-moon-white.png",
          "badge-text": "Sleep and Rest",
          "voice": {
            "name": "Gee Gu",
            "role": "",
            "message": "Deep sleep is when your body repairs. REM is when your mind sorts the day. Vilo reads both."
          }
        },
        {
          "title": "Don't just live. live <span class=\"secondary-text\">steady</span>",
          "subtitle": "",
          "description": "Vilo follows your heart rate and HRV through the day and night. When your HRV dips, it gives you the context to ease off or push on. Trends over time, never one alarming number.",
          "image": "/images/sections/customer-voice/2.webp",
          "alt": "Customer voice story 2",
          "badge-icon": "/images/icons/icon-heart-white.png",
          "badge-text": "Heart & Vitals",
          "voice": {
            "name": "Sissie Li",
            "role": "",
            "message": "HRV tends to fall when you're stressed, tired, or fighting something off."
          }
        },
        {
          "title": "Bring your energy into focus",
          "subtitle": "",
          "description": "Effort and recovery, read together. Vilo senses your movement and folds it into the bigger picture, so you know when to go harder and when to rest.",
          "image": "/images/sections/customer-voice/3.webp",
          "alt": "Customer voice story 3",
          "badge-icon": "/images/icons/icon-everday-white.png",
          "badge-text": "Energy & Fitness",
          "voice": {
            "name": "Ivy Wang",
            "role": "",
            "message": "Recovery is where progress actually happens. Vilo helps you see it."
          }
        },
        {
          "title": "Your <span class=\"secondary-text\">cycle</span>, in context",
          "subtitle": "",
          "description": " After ovulation your temperature rises and your resting heart rate climbs. That's physiology, not guesswork. Vilo follows the shift across your month, so a restless night or a low afternoon finally makes sense.",
          "image": "/images/sections/customer-voice/4.webp",
          "alt": "Customer voice story 4",
          "badge-icon": "/images/icons/icon-women-white.png",
          "badge-text": "Cycle",
          "voice": {
            "name": "Andy Xu",
            "role": "",
            "message": "Not every change needs a warning. Some just need context."
          }
        },{
          "title": "Read <span class=\"secondary-text\">closer</span> to your core",
          "subtitle": "",
          "description": "Your skin temperature shifts in small, telling ways across a night and a month. Read as a trend, it adds real context to sleep, recovery, and cycle.",
          "image": "/images/sections/customer-voice/5.webp",
          "alt": "Customer voice story 5",
          "badge-icon": "/images/icons/icon-temperature-white.png",
          "badge-text": "Temperature",
          "voice": {
            "name": "Jocelyn Yin",
            "role": "",
            "message": "Your body often runs warmer before you feel the first sign of change."
          }
        },{
          "title": "Quiet by default",
          "subtitle": "",
          "description": " Six signals, one calm read. Signal OS draws them together and speaks only when there's something worth saying. You wear it like jewelry. It works like a sense you didn't have before.",
          "image": "/images/sections/customer-voice/6.webp",
          "alt": "Customer voice story 6",
          "badge-icon": "/images/icons/icon-star-white.png",
          "badge-text": "Everyday",
          "voice": {
            "name": "Ben Zhang",
            "role": "",
            "message": "The best insight is the one that arrives at the right moment, not all the time."
          }
        }
      ]
    }
  </script>

  <template class="js-customer-voice-slide-template">
    <article class="customer-voice-card swiper-slide">
      <div class="customer-voice-card__media">
        <img class="customer-voice-card__image" loading="lazy" decoding="async" alt="">
        <div class="customer-voice-card__badge">
          <img class="customer-voice-card__badge-icon" alt="">
          <span class="customer-voice-card__badge-text"></span>
        </div>
        <button type="button" class="customer-voice-card__open" aria-label="Open story">
          <span class="icon-plus">
            <img class="skip-img-fadein" src="/images/icons/icon-plus-black.png" alt="open story" width="24" height="24" decoding="async">
          </span>
        </button>
        <div class="customer-voice-card__copy">
          <h3 class="customer-voice-card__title"></h3>
          <p class="customer-voice-card__subtitle"></p>
        </div>
      </div>
    </article>
  </template>

  <modal-dialog id="customer-voice-dialog" data-no-dismiss-cookie>
    <div class="customer-voice-modal">
      <button type="button" class="customer-voice-modal__close js-close-modal-dialog" aria-label="Close modal">
        <img class="skip-img-fadein" src="/images/icons/icon-close-dark.png" alt="" width="20" height="20" decoding="async">
      </button>

      <div class="swiper customer-voice-modal-swiper">
        <div class="swiper-wrapper js-customer-voice-modal-slides"></div>
      </div>

      <div class="customer-voice-modal__controls">
        <a class="customer-voice__cta btn-with-animation" href="">
          <span class="customer-voice__cta-text"></span>
          <load src="/_icons/icon-animation-arrow.html" />
        </a>
        <div class="swiper-nav-btns">
          <div class="swiper-button-prev">
            <load src="/_icons/icon-prev-slide-arrow.html" />
          </div>
          <div class="swiper-button-next">
            <load src="/_icons/icon-next-slide-arrow.html" />
          </div>
        </div>
      </div>
    </div>
  </modal-dialog>

  <template class="js-customer-voice-modal-slide-template">
    <div class="swiper-slide customer-voice-modal-slide">
      <div class="customer-voice-modal-slide__media">
        <img class="customer-voice-modal-slide__image" loading="lazy" decoding="async" alt="">
        <div class="customer-voice-card__badge">
          <img class="customer-voice-card__badge-icon" alt="">
          <span class="customer-voice-card__badge-text"></span>
        </div>
      </div>
      <div class="customer-voice-modal-slide__content">
        <h2 class="customer-voice-modal-slide__title"></h2>
        <div class="customer-voice-modal-slide__scroll">
          <p class="customer-voice-modal-slide__description"></p>
          <article class="customer-voice-modal-slide__voice">
            <span class="customer-voice-modal-slide__name"></span>
            <span class="customer-voice-modal-slide__role"></span>
            <blockquote class="customer-voice-modal-slide__quote">
              <p class="customer-voice-modal-slide__message"></p>
            </blockquote>
          </article>
        </div>
      </div>
    </div>
  </template>
</customer-voice>
