<section class="color-switch">
  <h2 class="color-switch__title">Ceramic like you've never seen</h2>
  <div class="color-switch__carousel">
    <div class="color-switch__media color-switch__media--main">
      <div class="swiper js-color-switch-main-slider">
        <div class="swiper-wrapper">
          <div class="swiper-slide">
            <img src="/images/color-related-images/golden-twist-1.webp" loading="lazy" decoding="async"
              alt="Vilo ring - Golden Twist">
          </div>
          <div class="swiper-slide">
            <img src="/images/color-related-images/silver-twist-1.webp" loading="lazy" decoding="async"
              alt="Vilo ring - Silver Twist">
          </div>
          <div class="swiper-slide">
            <img src="/images/color-related-images/imperial-jade-1.webp" loading="lazy" decoding="async"
              alt="Vilo ring - Imperial Jade">
          </div>
          <div class="swiper-slide">
            <img src="/images/color-related-images/glass-jade-1.webp" loading="lazy" decoding="async"
              alt="Vilo ring - Glass Jade">
          </div>
          <div class="swiper-slide">
            <img src="/images/color-related-images/ivory-jade-1.webp" loading="lazy" decoding="async"
              alt="Vilo ring - Ivory Jade">
          </div>
        </div>
      </div>
    </div>
    <div class="color-switch__media color-switch__media--secondary">
      <div class="swiper js-color-switch-secondary-slider">
        <div class="swiper-wrapper">
          <div class="swiper-slide">
            <img src="/images/color-related-images/golden-twist-2.webp" loading="lazy" decoding="async"
              alt="Vilo ring - Golden Twist">
          </div>
          <div class="swiper-slide">
            <img src="/images/color-related-images/silver-twist-2.webp" loading="lazy" decoding="async"
              alt="Vilo ring - Silver Twist">
          </div>
          <div class="swiper-slide">
            <img src="/images/color-related-images/imperial-jade-2.webp" loading="lazy" decoding="async"
              alt="Vilo ring - Imperial Jade">
          </div>
          <div class="swiper-slide">
            <img src="/images/color-related-images/glass-jade-2.webp" loading="lazy" decoding="async"
              alt="Vilo ring - Glass Jade">
          </div>
          <div class="swiper-slide">
            <img src="/images/color-related-images/ivory-jade-2.webp" loading="lazy" decoding="async"
              alt="Vilo ring - Ivory Jade">
          </div>
        </div>
      </div>
    </div>
    <div class="color-switch__copy">
      <div class="swiper js-color-switch-text-slider">
        <div class="swiper-wrapper">
          <div class="swiper-slide">
            <p class="color-switch__text">A gold that catches every light. Warm and twisted.</p>
          </div>
          <div class="swiper-slide">
            <p class="color-switch__text">A silver that moves with you. Cool and precise.</p>
          </div>
          <div class="swiper-slide">
            <p class="color-switch__text">A green with quiet depth. Rich and grounded.</p>
          </div>
          <div class="swiper-slide">
            <p class="color-switch__text">A blue for every version of you. Deep and dynamic.</p>
          </div>
          <div class="swiper-slide">
            <p class="color-switch__text">An ivory as soft as morning. Calm and luminous.</p>
          </div>
        </div>
      </div>
    </div>
    <div class="color-switch__nav-holder">
      <fieldset class="color-switch__nav">
        <legend class="sr-only">Ring colors</legend>
        <button type="button" class="color-switch__swatch js-color-switch-swatch is-active" style="--swatch-color-1: #998e67; --swatch-color-2: #bfb07b; --swatch-color-3: #f0ecd5" aria-pressed="true">
          <span class="color-switch__swatch-dot" aria-hidden="true"></span>
          <span class="color-switch__swatch-label">Golden Twist</span>
        </button>
        <button type="button" class="color-switch__swatch js-color-switch-swatch" style="--swatch-color-1: #666666; --swatch-color-2: #939291; --swatch-color-3: #f1f1f1" aria-pressed="false">
          <span class="color-switch__swatch-dot" aria-hidden="true"></span>
          <span class="color-switch__swatch-label">Silver Twist</span>
        </button>
        <button type="button" class="color-switch__swatch js-color-switch-swatch" style="--swatch-color-1: #484e3e; --swatch-color-2: #727b64; --swatch-color-3: #dadada" aria-pressed="false">
          <span class="color-switch__swatch-dot" aria-hidden="true"></span>
          <span class="color-switch__swatch-label">Imperial Jade</span>
        </button>
        <button type="button" class="color-switch__swatch js-color-switch-swatch" style="--swatch-color-1: #cdcdcd; --swatch-color-2: #cfcfcf; --swatch-color-3: #f1f1f1" aria-pressed="false">
          <span class="color-switch__swatch-dot" aria-hidden="true"></span>
          <span class="color-switch__swatch-label">Glass Jade</span>
        </button>
        <button type="button" class="color-switch__swatch js-color-switch-swatch" style="--swatch-color-1: #e7e7e7; --swatch-color-2: #f1f1f1; --swatch-color-3: #ffffff" aria-pressed="false">
          <span class="color-switch__swatch-dot" aria-hidden="true"></span>
          <span class="color-switch__swatch-label">Ivory Jade</span>
        </button>
      </fieldset>
    </div>
  </div>
</section>
