<section class="polaroid-gallery-section">
  <div class="container polaroid-gallery-section__container">
    <div class="polaroid-gallery-section__header">
      <h2 class="polaroid-gallery-section__title">Made for everyday life.</h2>
      <p class="polaroid-gallery-section__description">Tap a polaroid.</p>
    </div>

    <div class="polaroid-gallery" aria-label="Polaroid gallery">
      <button
        type="button"
        class="polaroid-card polaroid-card--1"
        aria-pressed="false"
        aria-label="View polaroid 1">
        <span class="polaroid-card__media">
          <img
            src="/images/sections/polaroid-gallery/image-1.webp"
            loading="lazy"
            decoding="async"
            alt="Vilo ring lifestyle moment">
        </span>
      </button>
      <button
        type="button"
        class="polaroid-card polaroid-card--2"
        aria-pressed="false"
        aria-label="View polaroid 2">

            src="/images/sections/polaroid-gallery/image-2.webp"
            loading="lazy"
            decoding="async"
            alt="Vilo ring on hand">
        </span>
      </button>
      <button
        type="button"

            src="/images/sections/polaroid-gallery/image-3.webp"
            loading="lazy"
            decoding="async"
            alt="Vilo ring case detail">
        </span>
      </button>
      <button
        type="button"
        class="polaroid-card polaroid-card--4 is-active"
