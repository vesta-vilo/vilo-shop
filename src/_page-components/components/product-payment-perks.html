<product-payment-perks>
  <!-- Perks for the "Deposit" payment option (shown while Deposit is selected) -->
  <div class="swiper product-payment-perks-swiper is-active" data-variant="Deposit">
    <ul class="swiper-wrapper">
      <li class="swiper-slide product-payment-perk">
        <img class="skip-img-fadein" src="/images/icons/icon-free-cancel.webp" alt="Cancel anytime" width="72" height="72" loading="lazy" decoding="async">
        <span>Cancel Anytime</span>
      </li>
      <li class="swiper-slide product-payment-perk">
        <img class="skip-img-fadein" src="/images/icons/icon-ships-by.webp" alt="Ships by October 2026" width="72" height="72" loading="lazy" decoding="async">
        <span>Ships by Oct ’26</span>
      </li>
      <li class="swiper-slide product-payment-perk">
        <img class="skip-img-fadein" src="/images/icons/icon-2-year-warranty-green.webp" alt="2-year warranty" width="65" height="72" loading="lazy" decoding="async">
        <span>2-Year Warranty</span>
      </li>
      <li class="swiper-slide product-payment-perk">
        <img class="skip-img-fadein" src="/images/icons/icon-60-days-free-trial.webp" alt="60-day free trial" width="72" height="72" loading="lazy" decoding="async">
        <span>60-Day Free Trial</span>
      </li>
    </ul>
  </div>
  <!-- Perks for the "Full Payment" payment option (shown while Full Payment is selected) -->
  <div class="swiper product-payment-perks-swiper" data-variant="Full Payment">
    <ul class="swiper-wrapper">
      <li class="swiper-slide product-payment-perk">
        <img class="skip-img-fadein" src="/images/icons/icon-free-cancel.webp" alt="Cancel anytime" width="72" height="72" loading="lazy" decoding="async">
        <span>Cancel Anytime</span>
      </li>
      <li class="swiper-slide product-payment-perk">
        <img class="skip-img-fadein" src="/images/icons/icon-ships-by.webp" alt="Ships by October 2026" width="72" height="72" loading="lazy" decoding="async">
        <span>Ships by Oct ’26</span>
      </li>
      <li class="swiper-slide product-payment-perk">
        <img class="skip-img-fadein" src="/images/icons/icon-2-year-warranty-green.webp" alt="2-year warranty" width="65" height="72" loading="lazy" decoding="async">
        <span>2-Year Warranty</span>
      </li>
      <li class="swiper-slide product-payment-perk">
        <img class="skip-img-fadein" src="/images/icons/icon-60-days-free-trial.webp" alt="60-day free trial" width="72" height="72" loading="lazy" decoding="async">
        <span>60-Day Free Trial</span>
      </li>
    </ul>
  </div>
</product-payment-perks>
