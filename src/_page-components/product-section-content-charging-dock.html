      <span class="compare-at-price light-text" data-compare-price> </span>
    </div>
    <div class="product-price__secondary">
      <div class="product-selling-info">
        <div class="product-selling-info__lead">HSA/FSA eligible</div>
        <div class="product-selling-info__installments bnpl-installments">
          <span class="bnpl-installments__lead">4 payments with</span>
          <span class="bnpl-installments__money">
            <span class="js-product-installment-price"></span>
          </span>
          <span class="bnpl-installments__with">with</span>

        </div>
      </div>
    </div>
  </div>
  <p class="product-description">
        <strong>Your ring, stood up and shown off.</strong>
    <span>A small black stone for your desk. Drop your Vilo over the top and it stands upright, lit from within, charging in plain sight.
</span>
  </p>
  <product-form data-product-handle="vilo-charging-dock">
    <div class="product-variant-picker">
      <fieldset class="swatch-container" data-option-name="color">
        <div class="swatch-list">
           <label class="swatch-item">
            <input type="radio" name="color-variant" value="Black" checked>
            <span class="swatch-visual">
              <img src="/images/product-page/product-swatch-pebble.webp" loading="lazy" fetchpriority="low" decoding="async"
                alt="Vilo - Pebble">
            </span>
            <span class="sr-only">Black</span>
          </label>

          <label class="swatch-item">
            <input type="radio" name="color-variant" value="White">
            <span class="swatch-visual">
              <img src="/images/product-page/product-swatch-chain.webp" loading="lazy" fetchpriority="low" decoding="async"
                alt="Vilo - Chain">
            </span>
            <span class="sr-only">White</span>
          </label>

        
    
          
    
     
        
     
        </div>

      </fieldset>
      
    
    </div>
    <button class="preorder-button js-preorder-button" data-fb-event="InitiateCheckout">
      <span>Pre-Order Now</span>
      <load src="/_icons/icon-animation-arrow.html" />

    <div class="js-contact-us-form get-notify-form">
      <form method="post" data-no-redirect>
        <div class="form-input-elements">
          <div class="error-tooltip" aria-live="polite">
            Please enter a valid email address

        </div>
        <button type="submit" class="btn" variant="primary" data-fb-event="SubmitApplication">
          Get Notified

        </button>
      </form>
    </div>
